name: Deploy

# DESATIVADO DE PROPÓSITO (ver `gh workflow disable`): o portfolio ainda é
# servido pelo GitHub Pages (deploy-pages.yaml), não por essa imagem Docker.
# Este workflow fica pronto pra quando a imagem for pra rodar na instância
# Oracle junto com sentiment-analysis-api e tweet-sentiment-analysis.
#
# Antes de reativar (`gh workflow enable Deploy`):
#   - Configurar os secrets OCI_* / GHCR neste repo (mesmos nomes usados em
#     sentiment-analysis-api e tweet-sentiment-analysis).
#   - Adicionar "ntsation-site" em terraform/ecr.tf e oci/registry.tf no
#     repo `server` (hoje só listam os dois apps Python) e aplicar.
#   - Decidir a porta/roteamento: a instância já expõe a porta 80 pro
#     container do sentiment-analysis-api. Rodar o nginx do portfolio
#     também na 80 vai colidir — precisa de um reverse proxy na frente dos
#     dois (ou revisar a security list pra outra porta) antes de ativar.

on:
  workflow_run:
    workflows: ["Docker CI/CD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  OCI_REGION: sa-saopaulo-1
  OCI_NAMESPACE: grun5vjqis7z
  OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  OCI_SECURITY_LIST_ID: ${{ secrets.OCI_SECURITY_LIST_ID }}
  OCIR_REPOSITORY: ntsation-site
  GHCR_IMAGE: ghcr.io/ntsation/portfolio
  CONTAINER_NAME: ntsation-site

jobs:
  deploy:
    name: Deploy na instância Oracle
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Instalar OCI CLI
        run: pip install --quiet oci-cli

      - name: Configurar OCI CLI
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_CI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_CI_USER_OCID }}
          fingerprint=${{ secrets.OCI_CI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=$OCI_REGION
          key_file=~/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config
          echo "OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True" >> "$GITHUB_ENV"

      - name: Login no OCIR
        run: echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login gru.ocir.io -u "$OCI_NAMESPACE/ci-deploy" --password-stdin

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Espelhar imagem do GHCR para o OCIR
        run: |
          OCIR_URI="gru.ocir.io/$OCI_NAMESPACE/$OCIR_REPOSITORY"
          IMAGE_TAG="${GITHUB_SHA::12}"
          docker buildx imagetools create \
            --tag "$OCIR_URI:$IMAGE_TAG" \
            "$GHCR_IMAGE:latest"
          echo "OCIR_URI=$OCIR_URI" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Achar a instância Oracle
        run: |
          INSTANCE_ID=$(oci compute instance list \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --display-name "instance-20260824-0846" \
            --lifecycle-state RUNNING \
            --query 'data[0].id' --raw-output)
          [ "$INSTANCE_ID" != "null" ] || { echo "Instância não encontrada ou não está running"; exit 1; }
          PUBLIC_IP=$(oci compute instance list-vnics --instance-id "$INSTANCE_ID" --query 'data[0]."public-ip"' --raw-output)
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"

      - name: Liberar IP do runner na porta 22
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"

          oci network security-list get --security-list-id "$OCI_SECURITY_LIST_ID" \
            --query 'data."ingress-security-rules"' > /tmp/current-rules.json

          python3 -c "
          import json
          rules = json.load(open('/tmp/current-rules.json'))
          rules.append({
              'description': 'CI runner (temporario)',
              'icmp-options': None,
              'is-stateless': False,
              'protocol': '6',
              'source': '$RUNNER_IP/32',
              'source-type': 'CIDR_BLOCK',
              'tcp-options': {'destination-port-range': {'min': 22, 'max': 22}, 'source-port-range': None},
              'udp-options': None
          })
          json.dump(rules, open('/tmp/new-rules.json', 'w'))
          "
          oci network security-list update --security-list-id "$OCI_SECURITY_LIST_ID" \
            --ingress-security-rules file:///tmp/new-rules.json --force

      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > ~/.ssh/oci_key.pem
          chmod 600 ~/.ssh/oci_key.pem

          for i in $(seq 1 10); do
            ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/oci_key.pem ubuntu@"$PUBLIC_IP" "echo ok" && break
            echo "Tentativa $i de conectar via SSH..."
            sleep 5
          done

          # Porta placeholder ate existir reverse proxy na frente dos
          # containers (80 ja e' do sentiment-analysis-api nesta instancia).
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/oci_key.pem ubuntu@"$PUBLIC_IP" bash -s <<EOF
            set -e
            echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login gru.ocir.io -u "$OCI_NAMESPACE/ci-deploy" --password-stdin
            docker pull "$OCIR_URI:$IMAGE_TAG"
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true
            docker run -d --name "$CONTAINER_NAME" --restart unless-stopped -p 8081:80 "$OCIR_URI:$IMAGE_TAG"
            docker image prune -f
            docker images "$OCIR_URI" --format '{{.Tag}}' | grep -xv "$IMAGE_TAG" | xargs -r -I{} docker rmi "$OCIR_URI:{}" || true
          EOF

      - name: Revogar IP do runner na porta 22
        if: always()
        run: |
          oci network security-list get --security-list-id "$OCI_SECURITY_LIST_ID" \
            --query 'data."ingress-security-rules"' > /tmp/current-rules.json

          python3 -c "
          import json
          rules = json.load(open('/tmp/current-rules.json'))
          rules = [r for r in rules if r.get('source') != '$RUNNER_IP/32']
          json.dump(rules, open('/tmp/new-rules.json', 'w'))
          "
          oci network security-list update --security-list-id "$OCI_SECURITY_LIST_ID" \
            --ingress-security-rules file:///tmp/new-rules.json --force

      - name: Smoke test (/)
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://$PUBLIC_IP:8081/" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "OK: / respondeu 200"
              exit 0
            fi
            echo "Tentativa $i: / respondeu $CODE"
            sleep 5
          done
          echo "Smoke test falhou: / não respondeu 200 a tempo"
          exit 1
