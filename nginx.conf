server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Immutable hashed assets produced by Vite
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback (site uses HashRouter today, but this keeps deep
  # links working if it ever moves to BrowserRouter)
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
